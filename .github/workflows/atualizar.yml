name: Atualizar rastreador

on:
  schedule:
    - cron: "17 3 * * *"   # todo dia às 00:17 (horário de Brasília), logo após o fechamento do candle diário
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
  push:                     # roda sozinho quando o script ou o workflow mudam
    branches: [main]
    paths: ["rastreador.py", ".github/workflows/atualizar.yml"]

permissions:
  contents: write

concurrency:
  group: rastreador
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcular tendências
        run: python rastreador.py
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          PYTHONUNBUFFERED: "1"   # mostra o progresso no log em tempo real
      - name: Salvar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Atualiza dados $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
